[project]
name = "demo-steel-beam-cross-section-optimization-ml"
version = "0.1.0"
description = "ML-driven optimization of steel beam cross sections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.7",
    "mlflow>=3.6.0",
    "papermill>=2.6.0",
    "pip>=25.3",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.7.2",
    "sectionproperties>=3.7.3",
    "sigmaepsilon-math>=2.2.0",
    "sigmaepsilon-solid-fourier>=2.1.3",
    "torch>=2.9.1",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cso"
module-root = "src"
